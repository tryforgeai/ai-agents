[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-adk-patterns"
version = "0.1.0"
description = "Reusable ADK workflow patterns for the AI Agents workspace"
requires-python = ">=3.11"
dependencies = ["google-adk==2.11.0", "litellm>=1.75,<2", "pydantic>=2,<3"]

[project.optional-dependencies]
crewai = ["crewai-tools>=0.76"]
tracing = ["arize-phoenix-otel", "openinference-instrumentation-google-adk"]

[tool.setuptools.packages.find]
where = ["src"]
