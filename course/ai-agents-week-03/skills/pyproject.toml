[project]
name = "skills"
version = "0.1.0"
description = "skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk[extensions]>=1.25.0",
    "sentence-transformers>=3.0",
    "svlearn-bootcamp>=0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# If you also build sdists and want data included:
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    # ... other includes like README, pyproject.toml, etc.
]

[tool.hatch.build.targets.wheel]
packages = ["src/skills"]

[project.scripts]
skillcraft-demo = "skills.run_demo:main"
skillcraft-scaffold = "skills.scaffold_skill:main"
skillcraft-remove = "skills.scaffold_skill:remove_main"
skillcraft-governor = "skills.governance.governor:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
