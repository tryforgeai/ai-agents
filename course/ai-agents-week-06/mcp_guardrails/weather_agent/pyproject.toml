[project]
name = "weather-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "svlearn-bootcamp>=0.1.7",
    "fastmcp>=4.1.4",
    "google-adk[mcp]>=2.13.0",
    "litellm>=1.90.0",
    "openinference-instrumentation-google-adk>=1.0.5",
    "arize-phoenix-otel>=0.17.1",
    "arize-phoenix>=20.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# If you also build sdists and want data included:
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    # ... other includes like README, pyproject.toml, etc.
]

[tool.hatch.build.targets.wheel]
packages = ["src/weather_agent"]
