[project]
name = "google-adk-mcp-oauth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "svlearn-bootcamp>=0.1.7",
    "fastmcp>=2.11.3",
    "click>=8.2.1",
    "google-adk[extensions]>=1.5.0",
    "langchain>=0.3.26",
    "langchain-google-genai>=2.1.6",
    "langchain-mcp-adapters>=0.1.8",
    "langgraph>=0.5.1",
    "python-dotenv>=1.1.1",
    "starlette>=0.46.2",
    "uvicorn>=0.35.0",
    "fastapi>=0.115.14",
    "rich>=14.0.0",
    "pyjwt>=2.10.1",
    "authlib>=1.6.1",
    "mcp>=1.13.1",
]

[tool.uv.sources]
fastmcp = { git = "https://github.com/jlowin/fastmcp", rev = "92c4c8d7f02c25127767fc79dafc0e7bdbf7f0e8" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# If you also build sdists and want data included:
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    # ... other includes like README, pyproject.toml, etc.
]

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]
